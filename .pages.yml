          - { name: blog_meta_description, label: "Άρθρα: περιγραφή για το Google", type: text }
          - { name: blog_title, label: "Άρθρα: τίτλος σελίδας", type: string }
          - { name: blog_lead, label: "Άρθρα: εισαγωγή", type: text }
          - { name: blog_empty, label: "Άρθρα: όταν δεν υπάρχει κανένα", type: string }
          - { name: blog_read, label: "Άρθρα: σύνδεσμος ανάγνωσης", type: string }
          - { name: blog_minute, label: "Άρθρα: 1 λεπτό ανάγνωσης", type: string }
          - { name: blog_minutes, label: "Άρθρα: λεπτά ανάγνωσης", type: string }
