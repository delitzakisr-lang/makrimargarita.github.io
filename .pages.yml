          - { name: quote_label, label: "Αποφθέγματα: όνομα για αναγνώστες οθόνης", type: string }

  # ------------------------------------------------------------ pages, English
  - name: pages-en
    label: Σελίδες στα αγγλικά
    type: group
    items:
      - { name: home-en, label: Αρχική (EN), type: file, path: content/en/home.json, format: json, fields: *home_fields }
      - { name: cv-en, label: Βιογραφικό (EN), type: file, path: content/en/cv.json, format: json, fields: *cv_fields }
      - { name: approach-en, label: Προσέγγιση (EN), type: file, path: content/en/approach.json, format: json, fields: *approach_fields }
      - { name: services-en, label: Υπηρεσίες (EN), type: file, path: content/en/services.json, format: json, fields: *services_fields }
      - { name: faq-en, label: Συχνές ερωτήσεις (EN), type: file, path: content/en/faq.json, format: json, fields: *faq_fields }
      - { name: booking-en, label: Κλείστε ραντεβού (EN), type: file, path: content/en/booking.json, format: json, fields: *booking_fields }
      - { name: privacy-en, label: Πολιτική απορρήτου (EN), type: file, path: content/en/privacy.json, format: json, fields: *privacy_fields }
      - { name: ui-en, label: "Μενού, κουμπιά και μικρά κείμενα (EN)", type: file, path: content/en/ui.json, format: json, fields: *ui_fields }
